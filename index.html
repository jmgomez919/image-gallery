<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Image Gallery</h1>

  <!-- Lightbox — toggled by JS -->
  <div class="lightbox">
    <div class="lightbox-card">
      <button id="btn-close" type="button" aria-label="Close">&#10005;</button>
      <img src="https://picsum.photos/seed/3/900/600" alt="Expanded image">
      <div class="lightbox-controls">
        <button id="btn-prev" type="button">&#8592; Prev</button>
        <div class="lightbox-dots"></div>
        <button id="btn-next" type="button">Next &#8594;</button>
      </div>
    </div>
  </div>

  <!-- Each image wrapped in a <button> for reliable Enter/Space support -->
  <div class="gallery">
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/1/600/400" alt="Gallery image 1">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/2/600/400" alt="Gallery image 2">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/3/600/400" alt="Gallery image 3">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/4/600/400" alt="Gallery image 4">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/5/600/400" alt="Gallery image 5">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/6/600/400" alt="Gallery image 6">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/7/600/400" alt="Gallery image 7">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/8/600/400" alt="Gallery image 8">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/9/600/400" alt="Gallery image 9">
    </button>
    <button type="button" class="gallery-item">
      <img src="https://picsum.photos/seed/10/600/400" alt="Gallery image 10">
    </button>
  </div>

  <script>
    const lightbox    = document.querySelector('.lightbox');
    const lightboxImg = document.querySelector('.lightbox-card img');
    const dotsEl      = document.querySelector('.lightbox-dots');
    const btnClose    = document.getElementById('btn-close');
    const btnPrev     = document.getElementById('btn-prev');
    const btnNext     = document.getElementById('btn-next');

    // Gallery buttons are the interactive elements; imgs are their children
    const galleryBtns = Array.from(document.querySelectorAll('.gallery-item'));
    const imgs        = galleryBtns.map(btn => btn.querySelector('img'));
    let currentIndex  = 0;

    // Highlight the first image on load so keyboard users have a clear starting point
    galleryBtns[0].classList.add('selected');

    // Build one dot per image
    const dots = imgs.map((_, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.classList.add('dot');
      dot.setAttribute('aria-label', `Go to image ${i + 1}`);
      dot.addEventListener('click', () => openLightbox(i));
      dotsEl.appendChild(dot);
      return dot;
    });

    // Track whether Enter is still held to prevent it firing on the newly focused btnClose
    let enterGuard = false;

    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = imgs[index].src;
      lightboxImg.alt = imgs[index].alt;

      // Sync gallery selection
      document.querySelector('.gallery-item.selected')?.classList.remove('selected');
      galleryBtns[index].classList.add('selected');

      // Sync active dot
      dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));

      lightbox.classList.add('active');

      // Defer focus until after paint; guard prevents Enter from closing via btnClose
      enterGuard = true;
      requestAnimationFrame(() => {
        btnClose.focus();
        enterGuard = false;
      });
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      galleryBtns[currentIndex].focus(); // Return focus to the gallery
    }

    function navigate(dir) {
      openLightbox((currentIndex + dir + imgs.length) % imgs.length);
    }

    // Gallery button clicks (Enter/Space handled natively by the browser)
    galleryBtns.forEach((btn, i) => btn.addEventListener('click', () => openLightbox(i)));

    // Lightbox controls
    btnClose.addEventListener('click', () => { if (!enterGuard) closeLightbox(); });
    btnPrev.addEventListener('click', () => navigate(-1));
    btnNext.addEventListener('click', () => navigate(1));

    // Backdrop click
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });

    // Keyboard navigation (arrow keys + Escape)
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); navigate(1);  }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); navigate(-1); }
      if (e.key === 'Escape')     closeLightbox();
    });
  </script>
</body>
</html>
