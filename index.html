<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Image Gallery</h1>

  <!-- Lightbox — toggled by JS -->
  <div class="lightbox">
    <div class="lightbox-card">
      <button id="btn-close" aria-label="Close">&#10005;</button>
      <img src="https://picsum.photos/seed/3/900/600" alt="Expanded image">
      <div class="lightbox-controls">
        <button id="btn-prev">&#8592; Prev</button>
        <button id="btn-next">Next &#8594;</button>
      </div>
    </div>
  </div>

  <div class="gallery">
    <img src="https://picsum.photos/seed/1/600/400" alt="Gallery image 1">
    <img src="https://picsum.photos/seed/2/600/400" alt="Gallery image 2">
    <img src="https://picsum.photos/seed/3/600/400" alt="Gallery image 3">
    <img src="https://picsum.photos/seed/4/600/400" alt="Gallery image 4">
    <img src="https://picsum.photos/seed/5/600/400" alt="Gallery image 5">
    <img src="https://picsum.photos/seed/6/600/400" alt="Gallery image 6">
    <img src="https://picsum.photos/seed/7/600/400" alt="Gallery image 7">
    <img src="https://picsum.photos/seed/8/600/400" alt="Gallery image 8">
    <img src="https://picsum.photos/seed/9/600/400" alt="Gallery image 9">
    <img src="https://picsum.photos/seed/10/600/400" alt="Gallery image 10">
  </div>

  <script>
    const lightbox    = document.querySelector('.lightbox');
    const lightboxImg = document.querySelector('.lightbox-card img');
    const btnClose    = document.getElementById('btn-close');

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    // Open on gallery image click, and mark as selected
    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => {
        document.querySelector('.gallery img.selected')?.classList.remove('selected');
        img.classList.add('selected');
        openLightbox(img.src, img.alt);
      });
    });

    // Close on ✕ button
    btnClose.addEventListener('click', closeLightbox);

    // Close on backdrop click (click lands on overlay, not the card)
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });
  </script>
</body>
</html>
