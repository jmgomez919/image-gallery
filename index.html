<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Image Gallery</h1>

  <!-- Lightbox — toggled by JS -->
  <div class="lightbox">
    <div class="lightbox-card">
      <button id="btn-close" type="button" aria-label="Close">&#10005;</button>
      <img src="https://picsum.photos/seed/3/900/600" alt="Expanded image">
      <div class="lightbox-controls">
        <button id="btn-prev" type="button">&#8592; Prev</button>
        <div class="lightbox-dots"></div>
        <button id="btn-next" type="button">Next &#8594;</button>
      </div>
    </div>
  </div>

  <div class="gallery">
    <img src="https://picsum.photos/seed/1/600/400" alt="Gallery image 1">
    <img src="https://picsum.photos/seed/2/600/400" alt="Gallery image 2">
    <img src="https://picsum.photos/seed/3/600/400" alt="Gallery image 3">
    <img src="https://picsum.photos/seed/4/600/400" alt="Gallery image 4">
    <img src="https://picsum.photos/seed/5/600/400" alt="Gallery image 5">
    <img src="https://picsum.photos/seed/6/600/400" alt="Gallery image 6">
    <img src="https://picsum.photos/seed/7/600/400" alt="Gallery image 7">
    <img src="https://picsum.photos/seed/8/600/400" alt="Gallery image 8">
    <img src="https://picsum.photos/seed/9/600/400" alt="Gallery image 9">
    <img src="https://picsum.photos/seed/10/600/400" alt="Gallery image 10">
  </div>

  <script>
    const lightbox    = document.querySelector('.lightbox');
    const lightboxImg = document.querySelector('.lightbox-card img');
    const dotsEl      = document.querySelector('.lightbox-dots');
    const btnClose    = document.getElementById('btn-close');
    const btnPrev     = document.getElementById('btn-prev');
    const btnNext     = document.getElementById('btn-next');

    const imgs = Array.from(document.querySelectorAll('.gallery img'));
    let currentIndex = 0;

    // Build one dot per image
    const dots = imgs.map((_, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.classList.add('dot');
      dot.setAttribute('aria-label', `Go to image ${i + 1}`);
      dot.addEventListener('click', () => openLightbox(i));
      dotsEl.appendChild(dot);
      return dot;
    });

    function openLightbox(index) {
      currentIndex = index;
      const img = imgs[index];
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;

      // Sync gallery selection
      document.querySelector('.gallery img.selected')?.classList.remove('selected');
      img.classList.add('selected');

      // Sync active dot
      dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIndex));

      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    function navigate(dir) {
      openLightbox((currentIndex + dir + imgs.length) % imgs.length);
    }

    // Gallery image clicks
    imgs.forEach((img, i) => img.addEventListener('click', () => openLightbox(i)));

    // Controls
    btnClose.addEventListener('click', closeLightbox);
    btnPrev.addEventListener('click', () => navigate(-1));
    btnNext.addEventListener('click', () => navigate(1));

    // Backdrop click
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });
  </script>
</body>
</html>
